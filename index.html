g tissue, not a pleural effusion you can drain with a chest tube. Removing fluid through the kidneys is the lecture’s choice."},{"id":"l08","deck":"lymph","prompt":"Lymph nodes filter lymph before it returns to the blood. They remove","choices":["Bacteria, viruses, cancer cells, and cell debris","Only excess salt, and they ignore cells","Oxygen, so lymph is always deoxygenated on purpose","Red cells that are still healthy, as their main job"],"answer":0,"explain":"Filter here means remove. The three node regions in the lecture are cervical, axillary, and inguinal."},{"id":"l09","deck":"lymph","prompt":"Inside a lymph node, macrophages and lymphocytes divide the work.","choices":["Macrophages are the filtering cells and eat what should not be there; lymphocytes are the detecting cells","Macrophages make antibodies and live only in the cortex; lymphocytes do not respond to antigens","Both cells only carry oxygen","Lymphocytes are monocytes that have left the blood, and macrophages are the same as B cells"],"answer":0,"explain":"Macrophages in nodes come from monocytes. Lymphocytes include T cells and B cells. Nodes slow the lymph so both jobs have time."},{"id":"l10","deck":"lymph","prompt":"Cortex and medulla of a lymph node","choices":["The outer cortex holds lymphocytes in follicles and makes antibodies; the inner medulla holds macrophages","The medulla holds only B cells; the cortex is empty","Both regions are simple squamous endothelium with no immune cells","The cortex is the recycle center for worn red cells"],"answer":0,"explain":"Most nodes are kidney-shaped, under half an inch long, and buried in connective tissue. The follicle centers in the cortex are the antibody centers."},{"id":"l11","deck":"lymph","prompt":"Which organs are the lymphoid organs in this lecture, besides lymph nodes?","choices":["Spleen, thymus, tonsils, Peyer’s patches, and appendix","Pituitary, thyroid, and adrenals only","Liver, stomach, and kidneys only","SA node and AV node"],"answer":0,"explain":"All of them are packed with lymphocytes. Lymph nodes are not the only lymphatic organs."},{"id":"l12","deck":"lymph","prompt":"The spleen","choices":["Filters blood, holds lymphocytes for immune surveillance, and recycles worn-out red cells","Is where T cells mature, overlying the heart","Makes insulin","Is a tonsil in the throat"],"answer":0,"explain":"The lecture calls it a recycle center. Removing it, a splenectomy, can treat some autoimmune disease, raises infection risk, and leaves the liver to take over part of the work."},{"id":"l13","deck":"lymph","prompt":"The thymus","choices":["Lies over the heart, works hardest in youth, and helps make the T lymphocytes that HIV attacks","Filters blood and recycles red cells in adults at its largest size","Sits in the ileum and is called a Peyer’s patch","Is an exocrine salivary gland"],"answer":0,"explain":"T cells learn what to fight in the thymus. The gland shrinks after childhood, which matches the endocrine lecture as well."},{"id":"l14","deck":"lymph","prompt":"Tonsils and tonsillitis","choices":["Tonsils trap pathogens in the throat; tonsillitis is inflammation from congestion, and chronically inflamed tonsils can become a source of infection","Tonsils are valves in leg veins","Tonsillitis is a low platelet count","Tonsils make red cells"],"answer":0,"explain":"They are small lymphoid masses. Congestion is the same idea the lecture uses for an inflamed appendix."},{"id":"l15","deck":"lymph","prompt":"Peyer’s patches","choices":["Sit in the wall of the ileum and filter bacteria, viruses, and debris from the intestinal contents","Are the cervical lymph nodes","Mature T cells over the heart","Are the coronary arteries"],"answer":0,"explain":"Similar follicles sit in the appendix. The lecture says about 70% of the immune system is in the Peyer’s patches and links patch dysfunction to “leaky gut,” allergies, and autoimmune disease."},{"id":"l16","deck":"lymph","prompt":"The appendix","choices":["Filters intestinal contents like Peyer’s patches. Appendicitis is congestion that can be life-threatening if the appendix is infected or ruptures","Is the pacemaker of the heart","Stores ADH","Is a vein with failed valves"],"answer":0,"explain":"The lecture also says removal may raise the risk of autoimmune disease. That is a different claim from the emergency of a ruptured appendix."},{"id":"l17","deck":"lymph","prompt":"Innate immunity and adaptive immunity","choices":["Innate defenses are inborn and immediate; adaptive defenses are learned and specific","Both are learned at the thymus after birth and neither is present in a newborn","Innate immunity is only antibodies; adaptive immunity is only skin","Adaptive immunity never involves lymphocytes"],"answer":0,"explain":"The immune system is a functional system, not one anatomical organ. Immunity in the lecture’s definition is specific resistance to disease."},{"id":"l18","deck":"lymph","prompt":"The first line of defense is","choices":["Skin, mucous membranes, and their secretions","Antibodies and lymphocytes","Only the inflammatory response","Vaccines"],"answer":0,"explain":"Acidic sweat, sebum, mucus, enzymes in saliva and tears, and acidic gastric juice are the secretions. The second line is innate cells plus inflammation. The third line is lymphocytes and antibodies."},{"id":"l19","deck":"lymph","prompt":"Which cells belong to the innate second line?","choices":["Macrophages, natural killer cells, and dendritic cells","Only B cells that secrete antibodies","Red cells and platelets","Chief cells of the stomach"],"answer":0,"explain":"Macrophages phagocytize and can cause fever; they come from monocytes. NK cells are lymphocytes that kill many cancer cells and virus-infected cells. Dendritic cells activate the adaptive system."},{"id":"l20","deck":"lymph","prompt":"The four signs of inflammation in this lecture are","choices":["Redness, heat, pain, and edema","Pallor, cold, numbness, and shrinking","Only fever and a rash","Agglutination, thrombus, embolus, and petechiae"],"answer":0,"explain":"Seeing all four means the body is answering an injury. Inflammation limits spread, clears debris and pathogens, and sets up repair."},{"id":"l21","deck":"lymph","prompt":"Cytokines released by damaged cells","choices":["Dilate vessels (redness and heat), make capillaries leaky (swelling and pain), and bring white cells in","Shut off the immune system for the rest of life","Lower body temperature and close every capillary","Convert fibrinogen into hemoglobin"],"answer":0,"explain":"The lecture includes kinins and histamine among those chemicals. White cells then leave the blood by diapedesis and phagocytize. The goal is healing."},{"id":"l22","deck":"lymph","prompt":"A cytokine storm is","choices":["Hyperinflammation in which the immune response does more damage than the disease","A normal first-line barrier of intact skin","Passive immunity from breast milk","The delay at the AV node"],"answer":0,"explain":"Cytokines are supposed to call a measured response. In a storm they amplify inflammation past the point of help."},{"id":"l23","deck":"lymph","prompt":"T lymphocytes and B lymphocytes","choices":["T cells attack antigens directly and learn in the thymus; B cells release antibodies and learn in the bone marrow","T cells make antibodies in the bone marrow; B cells are the same as neutrophils","Both cells are innate macrophages","Neither cell can recognize an antigen"],"answer":0,"explain":"The lecture’s memory hook is the first letter: T in the thymus, B in the bone marrow. Antibodies act on antigens indirectly."},{"id":"l24","deck":"lymph","prompt":"An antigen is","choices":["Any substance that excites the immune system, including microbes, foreign proteins, and sometimes self proteins","Only a harmless nutrient such as glucose","A hormone stored in the posterior pituitary","The lumen of an artery"],"answer":0,"explain":"Examples from the lecture: bacteria, fungi, viruses, red-cell proteins A and B, pollen, and self proteins in autoimmune disease."},{"id":"l25","deck":"lymph","prompt":"How a lymphocyte becomes specific, in lecture order,","choices":["It is born in red marrow, matures in the thymus or marrow, meets one antigen in a secondary organ, and then circulates looking for that antigen","It recognizes every antigen equally well for life","It learns its antigen inside a red cell","It is activated only in the stomach"],"answer":0,"explain":"Secondary lymphoid organs, including nodes and spleen, are where naive cells meet antigen. After that, each cell is committed to one target."},{"id":"l26","deck":"lymph","prompt":"Passive immunity and active immunity","choices":["Passive immunity uses antibodies made by someone else and lasts a few weeks; active immunity is your own B cells making antibodies after infection or vaccination","Passive immunity is lifelong; active immunity lasts two days","Both require the recipient’s B cells to build the antibodies","Vaccines are passive; breast milk is active"],"answer":0,"explain":"Passive sources in the lecture: placenta, breast milk, and donated plasma. Protection is about 2 to 3 weeks. Active immunity can come from getting sick or from a vaccine."},{"id":"l27","deck":"lymph","prompt":"The SARS-CoV-2 vaccine, as used in this lecture, produces","choices":["Active immunity","Passive immunity","Only innate immunity, with no lymphocytes","A cytokine storm by design"],"answer":0,"explain":"A vaccine presents antigen so the recipient’s own B cells make antibodies. That is active immunity."},{"id":"l28","deck":"lymph","prompt":"Giving antibodies from the plasma of a recovered patient to a sick patient produces","choices":["Passive immunity","Active immunity","A new ABO blood type","Innate immunity that lasts for years"],"answer":0,"explain":"The sick patient’s B cells did not make those antibodies. Someone else did. The lecture treats that transfusion as short-lived passive immunity."},{"id":"l29","deck":"lymph","prompt":"Neutralization and agglutination","choices":["Are two antibody actions, and both make phagocytosis more effective","Are the two heart sounds","Destroy antibodies so antigens can spread","Are how steroid hormones travel in blood"],"answer":0,"explain":"Neutralization covers the dangerous parts of an antigen. Agglutination clumps cells. Macrophages then clear the result more easily."},{"id":"l30","deck":"lymph","prompt":"Allergy and autoimmune disease both overreact, but","choices":["Allergy targets a harmless environmental antigen and stops when that antigen is gone; autoimmune disease targets a self antigen that never leaves","Both stop as soon as the person leaves the room","Autoimmune disease targets pollen; allergy targets the thyroid","Neither one damages tissue"],"answer":0,"explain":"The self antigen is part of the body, so the reaction does not get an “off” signal from the antigen disappearing."},{"id":"l31","deck":"lymph","prompt":"Which autoimmune example is paired with the tissue the lecture says it damages?","choices":["Type I diabetes destroys pancreatic beta cells; Hashimoto’s thyroiditis destroys the thyroid; multiple sclerosis destroys white matter","Celiac disease destroys joints; rheumatoid arthritis destroys microvilli","Lupus destroys only the spleen and never the kidney","Hashimoto’s destroys bone marrow red cells only"],"answer":0,"explain":"Also in the lecture: celiac disease destroys microvilli, rheumatoid arthritis destroys joints, and lupus attacks nuclei, with damage in kidney, heart, lung, and skin."},{"id":"l32","deck":"lymph","prompt":"Natural killer cells","choices":["Are lymphocytes of the innate system that kill a variety of cancer cells and virus-infected cells","Are B cells that secrete antibodies after a vaccine","Are red cells with abnormal hemoglobin","Are the pacemaker cells of the right atrium"],"answer":0,"explain":"They are not the same as cytotoxic T cells, which are adaptive and specific. NK cells respond to a range of damaged or infected cells without that one-antigen training."}]};
    const KEY = "conduit-tags-v1";
    const letters = ["A","B","C","D","E","F"];
    let tags = load();
    let round = null;

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && parsed.state && parsed.state.tags ? parsed.state.tags : {};
      } catch { return {}; }
    }
    function save() {
      localStorage.setItem(KEY, JSON.stringify({ state: { tags }, version: 0 }));
    }
    function shuffle(list) {
      const next = list.slice();
      for (let i = next.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = next[i]; next[i] = next[j]; next[j] = t;
      }
      return next;
    }
    function collect(scope, kind) {
      let cards = scope === "all" ? DATA.cards : DATA.cards.filter((c) => c.deck === scope);
      if (kind === "unseen") cards = cards.filter((c) => tags[c.id] !== "known");
      if (kind === "work") cards = cards.filter((c) => tags[c.id] === "work");
      return shuffle(cards);
    }
    function counts() {
      let known = 0, work = 0;
      for (const card of DATA.cards) {
        if (tags[card.id] === "known") known++;
        else if (tags[card.id] === "work") work++;
      }
      return { known, work, left: DATA.cards.length - known, total: DATA.cards.length };
    }
    function start(scope, kind, queue) {
      round = { queue: queue || collect(scope, kind), index: 0, picked: null, correct: 0, wrong: 0, missed: [], scope, kind };
      render();
    }
    function el(html) {
      document.getElementById("app").innerHTML = html;
    }
    function render() {
      if (!round) return renderHome();
      const card = round.queue[round.index];
      if (!card) return renderDone();
      renderCard(card);
    }
    function renderHome() {
      const t = counts();
      const rows = DATA.decks.map((deck) => {
        const cards = DATA.cards.filter((c) => c.deck === deck.id);
        const known = cards.filter((c) => tags[c.id] === "known").length;
        const work = cards.filter((c) => tags[c.id] === "work").length;
        return `<li><button data-deck="${deck.id}"><span class="num">${deck.lecture}</span><span><strong>${deck.title}</strong><br><span class="muted">${deck.line}</span></span><span class="muted" style="margin-left:auto;text-align:right">${cards.length - known} left<br>${known} known · ${work} work</span></button></li>`;
      }).join("");
      el(`<p class="kicker">Unit IV · Transportation</p>
        <h1>Conduit</h1>
        <p class="muted">Flashcards from the endocrine, blood, heart, vessel, and lymph lectures. Pick an answer and the card tells you if it is correct. Tag what you know. The next shuffle leaves those cards out.</p>
        <div class="stats">
          <div class="stat"><span class="muted">Still in the shuffle</span><b>${t.left}</b></div>
          <div class="stat"><span class="muted">Known</span><b>${t.known}</b></div>
          <div class="stat"><span class="muted">Needs work</span><b>${t.work}</b></div>
        </div>
        <div class="row">
          <button class="btn primary" id="shuffle">Shuffle ${t.left} cards</button>
          <button class="btn" id="work">Needs work (${t.work})</button>
        </div>
        <h2>Lectures</h2>
        <ul class="lectures">${rows}</ul>
        <p class="muted">${t.total} cards. Tags stay in this browser.</p>
        <p><button class="btn" id="clear">Clear all tags</button></p>`);
      document.getElementById("shuffle").onclick = () => start("all", "unseen");
      document.getElementById("work").onclick = () => start("all", "work");
      document.getElementById("clear").onclick = () => { tags = {}; save(); render(); };
      document.querySelectorAll("[data-deck]").forEach((node) => {
        node.onclick = () => start(node.getAttribute("data-deck"), "unseen");
      });
    }
    function renderCard(card) {
      const deck = DATA.decks.find((d) => d.id === card.deck);
      const choices = card.choices.map((choice, i) => {
        let cls = "choice";
        if (round.picked !== null && i === card.answer) cls += " good";
        else if (round.picked !== null && i === round.picked) cls += " bad";
        return `<button class="${cls}" data-choice="${i}" ${round.picked !== null ? "disabled" : ""}><span class="muted">${letters[i]}</span><span>${choice}</span></button>`;
      }).join("");
      let verdict = `<p class="muted">Choose an answer.</p>`;
      if (round.picked !== null) {
        const ok = round.picked === card.answer;
        verdict = `<div class="verdict ${ok ? "good" : "bad"}" role="status"><p class="stamp ${ok ? "good" : "bad"}">${ok ? "Correct" : "Incorrect"}</p>${ok ? "" : `<p><strong>Answer: ${card.choices[card.answer]}</strong></p>`}<p>${card.explain}</p></div>`;
      }
      const tag = tags[card.id];
      el(`<div class="study"><div class="top"><button class="btn" id="home">Lectures</button><span class="muted">${round.index + 1} / ${round.queue.length}</span><button class="btn" id="reshuffle">New shuffle</button></div>
        <progress value="${round.index}" max="${round.queue.length}"></progress>
        <p class="muted">${round.correct} right, ${round.wrong} wrong · Known cards hidden on the next shuffle</p>
        <article class="q"><p class="kicker">Lecture ${deck.lecture} · ${deck.title}</p><h1>${card.prompt}</h1>${choices}${verdict}</article>
        ${round.picked === null ? "" : `<div class="actions"><span><button class="btn ${tag === "known" ? "good" : ""}" id="known">Known</button> <button class="btn ${tag === "work" ? "primary" : ""}" id="worktag">Needs work</button></span><button class="btn ink" id="next">Next</button></div>`}
        <p class="muted">Known cards drop out of the next shuffle.</p></div>`);
      document.getElementById("home").onclick = () => { round = null; render(); };
      document.getElementById("reshuffle").onclick = () => start(round.scope, round.kind);
      document.querySelectorAll("[data-choice]").forEach((node) => {
        node.onclick = () => {
          if (round.picked !== null) return;
          const choice = Number(node.getAttribute("data-choice"));
          const ok = choice === card.answer;
          round.picked = choice;
          if (ok) round.correct++; else { round.wrong++; round.missed.push(card.id); }
          render();
        };
      });
      const knownBtn = document.getElementById("known");
      const workBtn = document.getElementById("worktag");
      const nextBtn = document.getElementById("next");
      if (knownBtn) knownBtn.onclick = () => mark(card.id, "known");
      if (workBtn) workBtn.onclick = () => mark(card.id, "work");
      if (nextBtn) nextBtn.onclick = () => { round.index++; round.picked = null; render(); };
    }
    function mark(id, tag) {
      if (tags[id] === tag) delete tags[id];
      else tags[id] = tag;
      save();
      render();
    }
    function renderDone() {
      const empty = round.queue.length === 0;
      el(`<p class="kicker">Shuffle</p><h1>${empty ? "Nothing left to shuffle" : "Shuffle finished"}</h1>
        <p>${empty ? "Known cards are hidden. Study them anyway, or clear those tags." : `<b>${round.correct}</b> correct · <b>${round.wrong}</b> incorrect`}</p>
        <p class="muted">Cards you mark Known stay out of the next shuffle.</p>
        <div class="row">
          ${empty ? "" : `<button class="btn primary" id="again">Shuffle again</button>`}
          ${round.missed.length ? `<button class="btn" id="missed">Retry the ones you missed</button>` : ""}
          ${empty ? `<button class="btn primary" id="anyway">Study them anyway</button>` : ""}
          <button class="btn" id="back">Back to lectures</button>
        </div>`);
      const again = document.getElementById("again");
      if (again) again.onclick = () => start(round.scope, round.kind);
      const missed = document.getElementById("missed");
      if (missed) missed.onclick = () => start(round.scope, "unseen", shuffle(DATA.cards.filter((c) => round.missed.includes(c.id) && tags[c.id] !== "known")));
      const anyway = document.getElementById("anyway");
      if (anyway) anyway.onclick = () => start(round.scope, "all");
      document.getElementById("back").onclick = () => { round = null; render(); };
    }
    render();
  </script>
</body>
</html>
