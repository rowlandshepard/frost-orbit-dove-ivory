  <style>
    :root {
      --paper: #f3eee6; --card: #fbf7f1; --ink: #1b1915; --muted: #6d665e;
      --line: #e3d9cb; --accent: #8c3038; --good: #1e5c48;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Source Sans 3", "Segoe UI", sans-serif; font-size: 1.0625rem; line-height: 1.5; }
    h1, h2 { font-family: Fraunces, Georgia, serif; letter-spacing: -0.02em; text-wrap: balance; font-weight: 560; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .wrap { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
    .kicker { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    .muted { color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-top: 1.5rem; }
    .stat, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 0.85rem; }
    .stat { padding: 0.9rem; }
    .stat b { display: block; font-family: Fraunces, Georgia, serif; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; }
    .btn { min-height: 2.75rem; border-radius: 0.85rem; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 0.7rem 1rem; font-weight: 600; }
    .btn.primary { background: var(--accent); color: var(--card); border-color: var(--accent); }
    .btn.ink { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn.good { background: var(--good); color: var(--card); border-color: var(--good); }
    .lectures { list-style: none; margin: 0.5rem 0 0; padding: 0; border-top: 1px solid var(--line); }
    .lectures button { width: 100%; display: flex; gap: 1rem; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0.9rem 0; min-height: 2.75rem; color: inherit; }
    .num { width: 2.4rem; font-family: Fraunces, Georgia, serif; font-size: 1.5rem; color: var(--accent); }
    .study { max-width: 40rem; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    progress { width: 100%; height: 0.35rem; margin-top: 0.8rem; accent-color: var(--accent); }
    .q { margin-top: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 1.25rem; padding: 1.25rem; }
    .choice { width: 100%; display: flex; gap: 0.75rem; text-align: left; margin-top: 0.7rem; padding: 0.85rem 1rem; border-radius: 0.85rem; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .choice.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--card)); }
    .choice.bad { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
    .verdict { margin-top: 1rem; border-radius: 0.85rem; padding: 0.9rem 1rem; }
    .verdict.good { border: 1px solid color-mix(in srgb, var(--good) 45%, var(--line)); background: color-mix(in srgb, var(--good) 10%, var(--card)); }
    .verdict.bad { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
    .stamp { font-family: Fraunces, Georgia, serif; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; }
    .stamp.good { color: var(--good); }
    .stamp.bad { color: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: space-between; margin-top: 1rem; }
  </style>

  <script>
    const DATA = {"decks":[{"id":"endocrine","lecture":14,"title":"Endocrine system","line":"Hormones, feedback, and glands"},{"id":"blood","lecture":15,"title":"Blood","line":"Cells, clotting, and transfusion"},{"id":"heart","lecture":16,"title":"Heart","line":"Chambers, valves, and the double pump"},{"id":"vessels","lecture":17,"title":"Beat and vessels","line":"Rhythm, output, and circulation"},{"id":"lymph","lecture":18,"title":"Lymph and immunity","line":"Fluid return and defense"}],"cards":[{"id":"e01","deck":"endocrine","prompt":"Compared with the nervous system, the endocrine system produces responses that are","choices":["Short-term and very specific, such as one muscle contraction","Longer-term and more general, such as puberty","Limited to ducts that open onto a surface","Electrical signals that never enter the blood"],"answer":1,"explain":"The nervous system is fast and specific. The endocrine system is the slower control system and its effects, like growth at puberty, last longer and are broader."},{"id":"e02","deck":"endocrine","prompt":"A hormone is","choices":["A chemical messenger released into the blood by a gland","An electrical impulse stored in the posterior pituitary","A duct secretion such as sweat or saliva","A nutrient protein taken up by cells for energy"],"answer":0,"explain":"Hormones are chemical messengers. Glands release them into the blood, and they travel until they find a target."},{"id":"e03","deck":"endocrine","prompt":"These lectures say hormones help control all of the following except","choices":["Reproduction","Growth and development","Metabolism and homeostasis","The speed of a single skeletal-muscle action potential"],"answer":3,"explain":"The overview lists reproduction, growth and development, metabolism, and homeostasis. A single action potential is nervous-system timing, not a hormone effect."},{"id":"e04","deck":"endocrine","prompt":"Which sequence matches hormone physiology?","choices":["Secreted into the blood, travels to a target, binds receptors, and the cell changes","Secreted through a duct onto one surface and never binds a receptor","Made by the target, then destroyed before it can bind","Stored in bone and released only by a motor nerve"],"answer":0,"explain":"A gland secretes the hormone into the bloodstream. It reaches a target, binds receptors on the plasma membrane, and that binding changes the cell. The change depends on which hormone bound."},{"id":"e05","deck":"endocrine","prompt":"A cell is a hormone’s target only if it","choices":["Has receptor proteins that hormone can bind","Sits next to the gland that made the hormone","Lacks a plasma membrane","Is an exocrine duct"],"answer":0,"explain":"Targets have receptors the hormone can “unlock.” The hormone still travels through the blood until it finds those cells."},{"id":"e06","deck":"endocrine","prompt":"Which pairing is correct?","choices":["Exocrine glands use a duct to a specific place; endocrine glands secrete hormones into the blood","Exocrine glands secrete into the blood; endocrine glands always use a duct","Sweat glands are endocrine; the thyroid is exocrine","Both types can act only on cells that touch the gland"],"answer":0,"explain":"Sweat glands, salivary glands, and the digestive pancreas are exocrine. The thyroid, adrenals, and endocrine pancreas release into the blood and can reach the whole body."},{"id":"e07","deck":"endocrine","prompt":"Steroid hormones are","choices":["Made from cholesterol, fat-soluble, and carried on plasma proteins in the blood","Made from amino acids and able to travel freely because they dissolve in water","The same molecules as prostaglandins","Blocked directly by NSAIDs"],"answer":0,"explain":"Steroids come from cholesterol. They are hydrophobic, so they need plasma proteins to travel in blood. Amino-acid derivatives are the water-soluble group."},{"id":"e08","deck":"endocrine","prompt":"Amino-acid derivative hormones are","choices":["Water-soluble and can travel in blood without a carrier protein","Fat-soluble steroids that must bind a plasma protein","Made from arachidonic acid in cell membranes","Always the cause of chronic inflammation"],"answer":0,"explain":"They are built from amino acids and are hydrophilic, so they move through blood on their own."},{"id":"e09","deck":"endocrine","prompt":"Prostaglandins","choices":["Come from arachidonic acid, cause pain and inflammation, and are blocked by NSAIDs","Are cholesterol-based hormones stored in the pituitary","Lower blood glucose the way insulin does","Are released only by the pineal gland at night"],"answer":0,"explain":"Prostaglandins are fatty-acid derivatives of membrane arachidonic acid. Early inflammation helps limit damage; chronic inflammation contributes to disease."},{"id":"e10","deck":"endocrine","prompt":"Hormone levels in the blood are kept mostly by negative feedback. A classroom example is","choices":["High blood sugar triggers insulin release until the level returns toward normal, then release stops","High thyroid hormone makes the pituitary release more TSH without limit","A hormone keeps rising no matter what the blood level is","Positive feedback is the everyday control for most hormones"],"answer":0,"explain":"A change away from normal triggers hormone release that pushes the body back. Release stops once an appropriate blood level is reached."},{"id":"e11","deck":"endocrine","prompt":"Which list matches the major endocrine organs in this unit?","choices":["Hypothalamus, pituitary, pineal, thyroid, parathyroids, thymus, adrenals, pancreas, and gonads","Only sweat glands, salivary glands, and sebaceous glands","Cervical, axillary, and inguinal lymph nodes","SA node, AV node, and Purkinje fibers"],"answer":0,"explain":"Those are the organs mapped in the lecture, from the brain’s control centers through the gonads."},{"id":"e12","deck":"endocrine","prompt":"Control-center glands differ from primary glands because they","choices":["Direct other glands. The hypothalamus and pituitary are the control centers","Only secrete through ducts","Have an endocrine role that is never their main job","Make no hormones of their own"],"answer":0,"explain":"Primary glands act on body cells. Secondary organs can release hormones, but endocrine work is not their main job. Kidneys, heart, and digestive organs are the secondary examples."},{"id":"e13","deck":"endocrine","prompt":"A hypothalamic releasing hormone","choices":["Controls the pituitary. TRH makes the pituitary release the hormone that acts on the thyroid","Is stored in thyroid follicles and is the same molecule as T4","Directly raises blood calcium by activating osteoclasts","Is produced by pancreatic beta cells"],"answer":0,"explain":"Releasing hormones run the pituitary. The hypothalamus also makes primary hormones, ADH and oxytocin, which affect the body and do not regulate the pituitary."},{"id":"e14","deck":"endocrine","prompt":"Which hormones are made by the hypothalamus, stored in the posterior pituitary, and act on the body rather than on the pituitary?","choices":["Antidiuretic hormone and oxytocin","TSH and ACTH","Insulin and glucagon","T4 and calcitonin"],"answer":0,"explain":"ADH and oxytocin are the hypothalamic primary hormones. The posterior lobe stores them; it does not make the anterior-lobe stimulating hormones."},{"id":"e15","deck":"endocrine","prompt":"Antidiuretic hormone (ADH)","choices":["Targets the kidneys and causes them to retain water","Targets uterine smooth muscle and causes labor contractions","Lowers blood glucose","Is made in thyroid follicles and requires iodine"],"answer":0,"explain":"ADH’s target is the kidney. Keeping water raises blood volume. Oxytocin is the hormone for uterine contraction and milk release."},{"id":"e16","deck":"endocrine","prompt":"Oxytocin","choices":["Targets uterine smooth muscle and mammary glands: labor contractions and milk release","Causes the kidneys to retain water","Stimulates the adrenal cortex to release cortisol","Lowers blood calcium"],"answer":0,"explain":"Oxytocin is produced in the hypothalamus and stored in the posterior pituitary. It does not regulate other pituitary hormones."},{"id":"e17","deck":"endocrine","prompt":"Which medication would you give a patient with water intoxication?","choices":["A diuretic","An antidiuretic","Extra ADH","Calcitonin"],"answer":0,"explain":"The patient already has too much water. A diuretic makes the kidneys lose water. An antidiuretic would retain still more."},{"id":"e18","deck":"endocrine","prompt":"Which medication would you give a patient in shock from dangerously low blood pressure?","choices":["An antidiuretic","A diuretic","A drug that blocks all water retention","Insulin"],"answer":0,"explain":"Shock here means pressure is too low. Retaining water supports blood volume. A diuretic would drop volume further."},{"id":"e19","deck":"endocrine","prompt":"Which medication would you give a patient with pulmonary edema?","choices":["A diuretic","An antidiuretic","Extra ADH","Growth hormone"],"answer":0,"explain":"Fluid in the lungs needs to come off. A diuretic increases water loss. Retaining water would worsen the edema."},{"id":"e20","deck":"endocrine","prompt":"The pituitary is connected to the hypothalamus by the","choices":["Infundibulum, with many blood vessels for communication","Coronary sulcus","Cribriform plate of the ethmoid","Thoracic duct"],"answer":0,"explain":"The infundibulum is the stalk. The gland itself sits in the sella turcica of the sphenoid bone."},{"id":"e21","deck":"endocrine","prompt":"What skull structure protects the pituitary gland?","choices":["The sella turcica of the sphenoid bone","The cribriform plate of the ethmoid bone","The sella turcica of the ethmoid bone","The cribriform plate of the sphenoid bone"],"answer":0,"explain":"The sella turcica is the saddle of the sphenoid. The cribriform plate is ethmoid bone and is not the pituitary’s bony box."},{"id":"e22","deck":"endocrine","prompt":"Which statement about the pituitary lobes is correct?","choices":["The anterior lobe is glandular epithelium and produces hormones; the posterior lobe is nervous tissue and stores hypothalamic hormones","Both lobes only store hormones made in the thyroid","The posterior lobe produces TSH, ACTH, FSH, and LH","The anterior lobe stores ADH and oxytocin"],"answer":0,"explain":"Anterior: makes hormones. Posterior: stores ADH and oxytocin. Together they link the hypothalamus to the rest of the endocrine system."},{"id":"e23","deck":"endocrine","prompt":"Which pituitary hormones act on the body and do not command another gland?","choices":["Growth hormone and prolactin","TSH and ACTH","FSH and LH","TRH and thyroid hormone"],"answer":0,"explain":"GH affects cell division and growth. Prolactin affects mammary tissue. FSH, LH, TSH, and ACTH are the four stimulating hormones that drive other glands."},{"id":"e24","deck":"endocrine","prompt":"Which stimulating hormone is paired with the right target?","choices":["ACTH acts on the adrenal cortex; TSH acts on the thyroid; FSH and LH act on the gonads","TSH acts on the kidney; ACTH acts on the pancreas","Prolactin stimulates the thyroid; GH stimulates the adrenal medulla","FSH is stored in the posterior pituitary and targets the liver"],"answer":0,"explain":"The chain is hypothalamus, then pituitary, then a primary gland. Stimulating hormones make those glands secrete their own hormones."},{"id":"e25","deck":"endocrine","prompt":"The thyroid axis runs in which order?","choices":["Hypothalamic TRH, then pituitary TSH, then thyroid T4, which raises metabolism in body cells","Thyroid T4, then hypothalamic TSH, then pituitary TRH","Pituitary TRH, then thyroid ACTH, then insulin","Adrenal ACTH, then pineal melatonin, then T4"],"answer":0,"explain":"TRH is the releasing hormone, TSH is the stimulating hormone, and T4 (thyroxine) is the thyroid hormone that reaches essentially all cells."},{"id":"e26","deck":"endocrine","prompt":"If the thyroid releases too much thyroid hormone, negative feedback will","choices":["Decrease pituitary TSH","Increase pituitary TSH without limit","Make the posterior pituitary secrete T4","Raise blood calcium through PTH"],"answer":0,"explain":"Too much T4 lowers TSH. Too little T4 raises TSH. The pituitary responds to the hormone of the gland it stimulates."},{"id":"e27","deck":"endocrine","prompt":"Cole has sudden weight gain, always feels cold, T4 of 2.0 µg/dl (low), and TSH of 7.1. This pattern is","choices":["Hypothyroidism: TSH is high because the pituitary is trying to drive a failing thyroid","Hyperthyroidism: TSH should be high whenever T4 is high","Type I diabetes from loss of beta cells","Too much ADH, with no thyroid involved"],"answer":0,"explain":"The lecture’s case is autoimmune destruction of the thyroid. Low T4 removes negative feedback, so TSH climbs. A value of 7 for TSH is treated as high here."},{"id":"e28","deck":"endocrine","prompt":"In hyperthyroidism, when too much thyroid hormone is produced, TSH is expected to be","choices":["Low, because extra T4 feeds back and cuts pituitary TSH","High, moving in the same direction as T4","Unchanged, because TSH ignores T4","Made by the thyroid follicles themselves"],"answer":0,"explain":"High thyroid hormone is the opposite of Cole’s labs. The pituitary backs off instead of stimulating harder."},{"id":"e29","deck":"endocrine","prompt":"Thyroid hormone (thyroxine, T4)","choices":["Targets essentially all cells, raises metabolism and ATP formation, and needs iodine to be made","Lowers blood calcium by stimulating osteoclasts","Is made by the parathyroid glands on the back of the thyroid","Is stored in the posterior pituitary"],"answer":0,"explain":"The gland is two lobes over the anterior trachea, joined by an isthmus. Follicles make the hormone. It is also needed for tissue growth and development."},{"id":"e30","deck":"endocrine","prompt":"Calcitonin","choices":["Targets osteoclasts, reduces their activity, and lowers blood calcium","Raises blood calcium by activating osteoclasts","Is secreted by pancreatic alpha cells","Is the same hormone as parathyroid hormone"],"answer":0,"explain":"Calcitonin comes from the thyroid and pulls calcium the opposite way from PTH."},{"id":"e31","deck":"endocrine","prompt":"Parathyroid hormone (PTH)","choices":["Targets osteoclasts and kidneys, pulls calcium from bone, and raises blood calcium","Lowers blood calcium the way calcitonin does","Is made inside thyroid follicles and requires iodine","Lowers blood glucose"],"answer":0,"explain":"The parathyroid glands sit on the posterior thyroid. Osteoclasts put calcium ions into the blood."},{"id":"e32","deck":"endocrine","prompt":"Which hormone does the opposite of parathyroid hormone?","choices":["Calcitonin from the thyroid gland","Calcitriol from the skin","Cholecalciferol from the gut","Calcium from the kidneys"],"answer":0,"explain":"PTH raises blood calcium. Calcitonin lowers it by quieting osteoclasts."},{"id":"e33","deck":"endocrine","prompt":"The thymus","choices":["Lies in the upper thorax behind the sternum, is largest in children, and helps make T cells through thymosin","Is largest in older adults and makes insulin","Sits in the sella turcica","Filters lymph only in the inguinal region"],"answer":0,"explain":"It shrinks through adulthood. Thymosin supports development of the immune system’s T cells."},{"id":"e34","deck":"endocrine","prompt":"The adrenal glands","choices":["Sit on top of the kidneys and take part in the stress response and water balance","Are buried in the sella turcica","Are the two lobes wrapped around the trachea","Only secrete digestive enzymes"],"answer":0,"explain":"Each adrenal has a cortex and a medulla. The cortex itself has outer, middle, and inner layers."},{"id":"e35","deck":"endocrine","prompt":"The adrenal medulla produces epinephrine, which","choices":["Constricts blood vessels and raises heart rate and respiration, increasing oxygen delivery","Is a mineralocorticoid from the outer cortex","Lowers blood sugar for storage","Replaces insulin after a meal"],"answer":0,"explain":"The medulla is the inner, nervous-tissue-related core. Epinephrine is the acute stress hormone in this lecture, separate from the cortex steroids."},{"id":"e36","deck":"endocrine","prompt":"Match the adrenal cortex layers.","choices":["Outer layer mineralocorticoids, middle layer glucocorticoids, inner layer androgens","Outer layer insulin, middle layer glucagon, inner layer calcitonin","The cortex makes only epinephrine","Outer layer TSH, middle layer ACTH, inner layer GH"],"answer":0,"explain":"Salt, sugar, then sex hormones, from outside in: mineralocorticoids, glucocorticoids, androgens."},{"id":"e37","deck":"endocrine","prompt":"Mineralocorticoids","choices":["Come from the outer adrenal cortex, act on the kidney, and regulate water and salt balance","Suppress immunity the way prednisone does","Are the main product of the adrenal medulla","Are made by beta cells"],"answer":0,"explain":"They manage the mineral, or salt, content of the blood. The kidney is the target organ."},{"id":"e38","deck":"endocrine","prompt":"Why do physicians often tell patients with high blood pressure to eat less salt?","choices":["Salt, like mineralocorticoids, increases blood volume","Salt, like mineralocorticoids, decreases blood volume","Salt does not change blood volume","Salt destroys the adrenal medulla"],"answer":0,"explain":"More salt in the blood holds more water, so volume and pressure rise. The lecture also notes that dietary salt can lower mineralocorticoid release by negative feedback, which is why some argue a low-salt diet matters less if the adrenals and kidneys are healthy."},{"id":"e39","deck":"endocrine","prompt":"Glucocorticoids from the middle adrenal cortex","choices":["Raise blood sugar and suppress the immune system. Prednisone mimics them, and ACTH triggers their release","Lower blood sugar the way insulin does","Are stored in the posterior pituitary","Only affect the gonads"],"answer":0,"explain":"Extra sugar supports fight or flight. Suppressing inflammation and immunity leaves more resources for that response. They are anti-inflammatory."},{"id":"e40","deck":"endocrine","prompt":"Androgens of the adrenal cortex","choices":["Are sex hormones from the inner cortex, made in small amounts through life, mostly androgens plus some estrogens","Are the body’s only source of insulin","Replace thyroid hormone if iodine is missing","Are secreted by pancreatic alpha cells when sugar is low"],"answer":0,"explain":"The inner cortical layer is the sex-hormone zone. The amounts are small compared with the gonads, but they are made across life."},{"id":"e41","deck":"endocrine","prompt":"The pancreas is both an endocrine and an exocrine gland. Which pairing is right?","choices":["Islets make hormones that hold blood sugar steady; lobules make digestive enzymes","Islets make digestive enzymes; lobules make only insulin","The whole pancreas is a control-center gland like the pituitary","Alpha cells store ADH"],"answer":0,"explain":"Endocrine work is the pancreatic islets. Exocrine work is the lobules and their digestive enzymes."},{"id":"e42","deck":"endocrine","prompt":"Glucagon is","choices":["Released by alpha cells when blood sugar is low, and it raises sugar by making the liver release glucose","Released by beta cells when sugar is high","A steroid from the outer adrenal cortex","The same molecule as T4"],"answer":0,"explain":"Glucagon is the raising hormone. Insulin is the lowering hormone. They come from different islet cells."},{"id":"e43","deck":"endocrine","prompt":"Insulin is","choices":["Released by beta cells when blood sugar is high, and it lowers sugar by moving glucose into cells","Released by alpha cells when sugar is low","Made in the posterior pituitary","A prostaglandin blocked by NSAIDs"],"answer":0,"explain":"High sugar is the signal for insulin. Without it, sugar stays in the blood and cells cannot take it up."},{"id":"e44","deck":"endocrine","prompt":"In diabetes, sugar cannot enter cells and remains in the blood. Which pairing matches the lecture?","choices":["Type I is autoimmune destruction of insulin-making beta cells; Type II is insulin resistance","Type I is resistance; Type II is loss of alpha cells","Both types are caused by too much calcitonin","Diabetes means chronic low blood sugar from excess insulin only"],"answer":0,"explain":"The shared problem is sugar stuck in the blood. The cause differs: missing insulin versus cells that no longer respond to it."},{"id":"e45","deck":"endocrine","prompt":"Testosterone, and estrogen with progesterone,","choices":["Support production of sperm or eggs and influence secondary sex characteristics","Are stored in the posterior pituitary","Lower blood calcium","Are made only by the pineal gland"],"answer":0,"explain":"The lecture lists the gonads as the targets and ties these hormones to gametes plus secondary sex characteristics. FSH and LH from the pituitary are what stimulate the gonads."},{"id":"e46","deck":"endocrine","prompt":"The pineal gland","choices":["Is part of the epithalamus and makes melatonin, which rises at night, falls by day, and helps set sleep","Is the pacemaker of the heart","Secretes insulin when blood sugar is high","Requires iodine the way the thyroid does"],"answer":0,"explain":"Melatonin tracks light and dark. The lecture also notes it can affect reproductive organs."},{"id":"e47","deck":"endocrine","prompt":"Which is a secondary endocrine role, not the organ’s main job?","choices":["Kidneys release erythropoietin and renin; the heart releases atrial natriuretic peptide","The thyroid’s only job is to digest fat","The pituitary stores bile","Sweat glands secrete insulin into the blood"],"answer":0,"explain":"Erythropoietin increases red-cell production. Renin raises blood pressure. ANP lowers blood pressure. Digestive organs also release hormones that drive digestion."},{"id":"e48","deck":"endocrine","prompt":"Where is oxytocin produced?","choices":["In the hypothalamus, then stored in the posterior pituitary","In the anterior pituitary","In thyroid follicles","In the adrenal medulla"],"answer":0,"explain":"Production and storage are separate. The hypothalamus makes oxytocin and ADH. The posterior lobe only stores them."},{"id":"e49","deck":"endocrine","prompt":"Where is antidiuretic hormone stored?","choices":["Posterior pituitary","Anterior pituitary","Thyroid isthmus","Pancreatic islet"],"answer":0,"explain":"ADH is made in the hypothalamus and held in the posterior lobe until release. The anterior lobe is where TSH and the other stimulating hormones are produced."},{"id":"e50","deck":"endocrine","prompt":"Where is thyroid-stimulating hormone produced?","choices":["Anterior pituitary","Hypothalamus","Posterior pituitary","Parathyroid glands"],"answer":0,"explain":"TSH is one of the six anterior-lobe hormones. TRH from the hypothalamus tells the pituitary to release it. The thyroid then releases T4."},{"id":"b01","deck":"blood","prompt":"Blood is the body’s only fluid tissue. In these lectures it is classified as","choices":["Connective tissue","Epithelial tissue lining the heart","Nervous tissue","A pure solution with no cells"],"answer":0,"explain":"Cells are the formed elements, plasma is the ground substance, and proteins such as albumin and clotting proteins are the fibers of this connective tissue."},{"id":"b02","deck":"blood","prompt":"Which set matches the lecture’s description of whole blood?","choices":["About 8% of body weight, salty, pH 7.35–7.45, and about 100.4°F","About 40% of body weight, strongly acidic, and colder than the body","pH 6.5 and a temperature of 98.6°F exactly","Only plasma, with no formed elements"],"answer":0,"explain":"Salt keeps an isotonic environment for cells. The slight alkalinity is the 7.35–7.45 range. Friction of circulation makes blood warmer than ordinary body temperature."},{"id":"b03","deck":"blood","prompt":"The lecture’s split of whole blood is","choices":["Plasma about 55%, red cells about 45% (the hematocrit), and white cells plus platelets under 1%","Red cells 55%, plasma 45%, platelets half of the volume","White cells 45%, red cells 45%, plasma 10%","Serum 90% and clot 10%"],"answer":0,"explain":"The hematocrit is the red-cell percentage. The thin white-cell and platelet layer is the buffy coat, under 1%."},{"id":"b04","deck":"blood","prompt":"Plasma is mostly water plus dissolved substances. Which protein job is correct?","choices":["Albumin carries hydrophobic substances and holds water in the blood; clotting proteins help seal a vessel; antibodies defend","Albumin is a nutrient protein burned for ATP","Fibrinogen carries oxygen","Globulins are the heme groups of red cells"],"answer":0,"explain":"Plasma proteins stay in the bloodstream. They are not food proteins taken into cells for energy. Albumin also buffers pH. Globulins include antibodies and help move lipids."},{"id":"b05","deck":"blood","prompt":"All of the formed elements of blood are made in","choices":["Bone marrow, from rapidly dividing stem cells","Lymph nodes only","The spleen only, after birth","The liver sinusoids, and nowhere else"],"answer":0,"explain":"Red cells, white cells, and platelets all come from marrow. Platelets are fragments of megakaryocytes, not whole cells."},{"id":"b06","deck":"blood","prompt":"A red blood cell is built to carry oxygen. Which description matches the lecture?","choices":["Biconcave, no nucleus, no organelles, and essentially a bag of hemoglobin","Round with a large nucleus and many mitochondria","A fragment of a megakaryocyte","A complete cell that uses aerobic respiration to burn the oxygen it carries"],"answer":0,"explain":"The biconcave shape adds surface area and flexibility. No nucleus means no mitosis. No mitochondria means the cell does not use the oxygen it is transporting."},{"id":"b07","deck":"blood","prompt":"Hemoglobin in this lecture","choices":["Is an iron-containing protein; each red cell has about 250 million hemoglobin molecules and can bind about a billion oxygen molecules if hemoglobin is 12–18 g per 100 ml","Is a plasma antibody","Is made by platelets during a clot","Carries only carbon dioxide and never oxygen"],"answer":0,"explain":"Counts from the formed-element table: red cells are about 4–6 million per mm³ and their job is oxygen transport, plus help with carbon dioxide."},{"id":"b08","deck":"blood","prompt":"Anemia is","choices":["A decrease in the blood’s ability to carry oxygen, from too few red cells or too little hemoglobin","Too many red cells and blood that is too thick","A clot that breaks free and lodges in the brain","A low platelet count with petechiae"],"answer":0,"explain":"Two routes to the same problem: fewer cells, or cells with less hemoglobin. Sickle cell anemia is abnormally shaped hemoglobin."},{"id":"b09","deck":"blood","prompt":"Polycythemia is","choices":["Too many red cells, which thickens the blood and slows circulation","Too few white cells after prednisone","A genetic shortage of clotting factors","Universal-donor blood"],"answer":0,"explain":"The lecture lists three causes: bone marrow cancer, heart disease, and life at high altitude. Extra red cells raise viscosity."},{"id":"b10","deck":"blood","prompt":"Why did EPO blood doping increase aerobic performance in the lecture’s example?","choices":["More red cells carry more oxygen to cells, so more ATP can be made","EPO destroys hemoglobin and forces anaerobic respiration","EPO is a diuretic that lowers blood volume","EPO turns type A blood into type O"],"answer":0,"explain":"Erythropoietin, including the kidney’s own hormone, drives red-cell production. Artificially raising the count was the doping point."},{"id":"b11","deck":"blood","prompt":"White blood cells differ from red cells because they","choices":["Have a nucleus and organelles and are the only complete cells in the blood","Have no nucleus, so they can carry more oxygen","Are cell fragments used only for clotting","Never leave the bloodstream"],"answer":0,"explain":"They are sorted partly by nucleus shape. Their job is defense, not oxygen transport."},{"id":"b12","deck":"blood","prompt":"Diapedesis and chemotaxis mean","choices":["White cells leave vessels into tissue, and they move toward chemicals from damaged tissue","Red cells divide inside a clot","Platelets become hemoglobin","Plasma proteins are eaten as nutrients"],"answer":0,"explain":"A white cell uses blood as a ride, then leaves the vessel to fight in the tissue. Chemotaxis is how it finds the damage."},{"id":"b13","deck":"blood","prompt":"Match the white-cell counts.","choices":["Leukocytosis is a high count and usually means infection; leukopenia is a low count; leukemia is cancerous marrow pouring out immature white cells","Leukopenia is a high count during a mild cold; leukemia is too few red cells","Leukocytosis means the marrow has stopped","All three terms mean a low platelet count"],"answer":0,"explain":"Leukopenia is linked to drugs such as prednisone and anticancer agents, and also to a severe infection that pulls cells out faster than marrow replaces them."},{"id":"b14","deck":"blood","prompt":"Leukemia and lymphoma are told apart by","choices":["Leukemia can affect any marrow cell; lymphoma affects only lymphocytes and only in lymph nodes","They are two names for the same cancer of red cells","Lymphoma is a low platelet count; leukemia is a clot","Leukemia never involves white cells"],"answer":0,"explain":"Location and cell type are the lecture’s distinction. Leukemia fills the blood with immature white cells from cancerous marrow."},{"id":"b15","deck":"blood","prompt":"Granulocytes and agranulocytes are","choices":["Granulocytes have visible granules and lobed nuclei (neutrophils, eosinophils, basophils); agranulocytes do not show granules and include lymphocytes and monocytes","Granulocytes are red cells; agranulocytes are platelets","Both groups lack nuclei","Agranulocytes are the only cells that carry oxygen"],"answer":0,"explain":"The granule and nucleus rules are how the lecture sorts the five white-cell types."},{"id":"b16","deck":"blood","prompt":"From most abundant to least, white cells run","choices":["Neutrophils, lymphocytes, monocytes, eosinophils, basophils","Basophils, eosinophils, monocytes, lymphocytes, neutrophils","Lymphocytes, neutrophils, basophils, monocytes, eosinophils","Monocytes, neutrophils, lymphocytes, basophils, eosinophils"],"answer":0,"explain":"Never Let Monkeys Eat Bananas: neutrophils, lymphocytes, monocytes, eosinophils, basophils."},{"id":"b17","deck":"blood","prompt":"Neutrophils","choices":["Are the most numerous white cells, have a multilobed nucleus, and phagocytize bacteria and fungi at an active infection","Kill parasites and drive allergic responses","Become macrophages in chronic infection","Make antibodies"],"answer":0,"explain":"Their numbers rise in bacterial infection. They are the first of the “Never…” list."},{"id":"b18","deck":"blood","prompt":"Which white cell is associated with allergies?","choices":["Eosinophil","Neutrophil","Lymphocyte","Megakaryocyte"],"answer":0,"explain":"Eosinophils have a multilobed nucleus and brick-red granules. They kill parasites and take part in allergic responses."},{"id":"b19","deck":"blood","prompt":"Which white cell is associated with viral infection?","choices":["Lymphocyte","Neutrophil","Eosinophil","Platelet"],"answer":0,"explain":"Lymphocytes are the second most common white cell, with a large round nucleus. They live in blood and lymph nodes. Numbers rise, and sometimes later fall, in viral infection."},{"id":"b20","deck":"blood","prompt":"Which white cell is associated with bacterial infection?","choices":["Neutrophil","Lymphocyte","Basophil","Eosinophil"],"answer":0,"explain":"Neutrophils are the phagocytes at active bacterial and fungal sites. Lymphocytes are the viral-associated cells in this lecture’s matching set."},{"id":"b21","deck":"blood","prompt":"Which white cell is associated with chronic infection?","choices":["Monocyte","Neutrophil","Eosinophil","Basophil"],"answer":0,"explain":"Monocytes are the largest white cells, with a kidney-shaped nucleus. In tissues they become macrophages and matter most in chronic infection."},{"id":"b22","deck":"blood","prompt":"Which white cell mimics eosinophils and is the rarest?","choices":["Basophil","Neutrophil","Lymphocyte","Monocyte"],"answer":0,"explain":"Basophils are the rarest white cells. The lecture says they mimic eosinophil behavior."},{"id":"b23","deck":"blood","prompt":"Lymphocytes include","choices":["B cells that make antibodies, T cells that kill infected cells, and NK cells that kill suspicious cells","Only neutrophils that eat bacteria","Platelets and red cells","Cells with no nucleus"],"answer":0,"explain":"That is the lecture’s long-term immune roster. Lymphocytes are agranulocytes and the detecting cells of lymph nodes as well."},{"id":"b24","deck":"blood","prompt":"Platelets are","choices":["Fragments of megakaryocytes, needed for hemostasis","Whole cells with a nucleus that carry oxygen","Plasma proteins that never leave the liver","The same as fibrin"],"answer":0,"explain":"The count in the table is about 250,000–400,000 per mm³. Their job is clotting, not immunity or oxygen transport."},{"id":"b25","deck":"blood","prompt":"The three phases of hemostasis, in order, are","choices":["Vascular spasm, platelet plug, coagulation","Coagulation, spasm, then diapedesis","Agglutination, diapedesis, chemotaxis","Fibrinolysis, then thrombus, then embolus"],"answer":0,"explain":"Spasm narrows the vessel immediately. Platelets then stick and call more platelets. Coagulation builds the fibrin clot."},{"id":"b26","deck":"blood","prompt":"During coagulation","choices":["Clotting factors, tissue chemicals, and calcium form thrombin, which turns fibrinogen into insoluble fibrin","Hemoglobin becomes a platelet plug with no proteins involved","Albumin forms the mesh that traps red cells","The vessel dilates to increase blood loss"],"answer":0,"explain":"Fibrin is the hair-like mesh. It traps red cells and platelets. A typical clot forms in 3 to 6 minutes and is removed after the wall heals."},{"id":"b27","deck":"blood","prompt":"A thrombus and an embolus differ because","choices":["A thrombus is a clot in an unbroken vessel; an embolus is that clot after it breaks free and floats","A thrombus is too few platelets; an embolus is too many red cells","Both words mean a low clotting-factor disease","An embolus stays where it formed and never moves"],"answer":0,"explain":"A thrombus can be deadly in the lungs. An embolus can later jam a critical vessel, including one in the brain."},{"id":"b28","deck":"blood","prompt":"Thrombocytopenia and hemophilia are both “not enough clotting,” but","choices":["Thrombocytopenia is too few platelets and can show as petechiae; hemophilia is too few clotting proteins and is genetic","Both are too many red cells","Hemophilia is a high white-cell count; thrombocytopenia is diabetes","Both are treated by blocking prostaglandins only"],"answer":0,"explain":"With too few platelets, ordinary movement can bleed tiny vessels. With hemophilia, minor tissue damage can bleed for a dangerously long time."},{"id":"b29","deck":"blood","prompt":"Blood loss in this lecture","choices":["Causes weakness after about 15–30% is lost, and shock that can be fatal after more than 30%","Is harmless until 70% is gone","Only matters if the lost blood is type AB","Is replaced by platelets alone, with no transfusion"],"answer":0,"explain":"Transfusions replace cells after hemorrhage, anemia, leukopenia from cancer treatment, or thrombocytopenia."},{"id":"b30","deck":"blood","prompt":"ABO type is determined by","choices":["Whether the A antigen, the B antigen, both, or neither is on the red cells","Only the Rh antigen","The number of platelets","Which white cell is most numerous"],"answer":0,"explain":"Both antigens: type AB. Only A: type A. Only B: type B. Neither: type O. Antibodies in typing serum make matching cells clump."},{"id":"b31","deck":"blood","prompt":"A person who is Rh-negative receives Rh-positive blood. What happens next, according to the lecture?","choices":["The immune system becomes sensitized and makes anti-Rh antibodies; later Rh-positive transfusions are attacked","Nothing, because Rh-negative people can always receive Rh-positive blood","The donor blood loses its antigens immediately","The recipient permanently becomes type AB"],"answer":0,"explain":"Most Americans are Rh-positive and already carry the antigen. An Rh-negative person does not, until exposure teaches the immune system to attack it."},{"id":"b32","deck":"blood","prompt":"Hemolytic disease of the newborn in this lecture is a risk when","choices":["The mother is Rh-negative and the child inherits Rh-positive blood; later pregnancies face antibodies the mother made after the first","The mother is Rh-positive and the child is Rh-negative","Both mother and child are type O","The father lacks every ABO antigen"],"answer":0,"explain":"RhoGAM can block the buildup of anti-Rh antibodies. ABO mismatch does not hit this hard in the lecture’s account."},{"id":"b33","deck":"blood","prompt":"Red cells carry A antigens and Rh antigens, and no B antigens. The type is","choices":["A positive","A negative","B positive","O negative"],"answer":0,"explain":"A antigen means group A. Rh antigen means positive. No B antigen, so it is not AB or B."},{"id":"b34","deck":"blood","prompt":"Red cells carry only B antigens. The type is","choices":["B negative","B positive","AB positive","O positive"],"answer":0,"explain":"B antigens without A means group B. No Rh antigen means negative."},{"id":"b35","deck":"blood","prompt":"Red cells carry Rh antigens and neither A nor B. The type is","choices":["O positive","O negative","AB negative","A positive"],"answer":0,"explain":"No A and no B is group O. The Rh antigen makes it positive."},{"id":"b36","deck":"blood","prompt":"Red cells carry A, B, and Rh antigens. The type is","choices":["AB positive","AB negative","O positive","A positive"],"answer":0,"explain":"Both ABO antigens make AB. Rh makes it positive. AB positive is the universal recipient."},{"id":"b37","deck":"blood","prompt":"Which statement about transfusion matches the lecture?","choices":["AB positive is the universal recipient; O negative is the universal donor","O positive is the universal recipient; AB negative is the universal donor","Type A can receive B and AB","Rh-negative blood can safely receive Rh-positive blood"],"answer":0,"explain":"A recipient can take donor cells only if those cells do not carry an antigen the recipient lacks. AB positive already has A, B, and Rh. O negative has none of them to give."},{"id":"b38","deck":"blood","prompt":"Which blood types can a B-positive patient receive?","choices":["B positive, B negative, O positive, and O negative","Only B positive","A positive, A negative, and AB positive","Every type, including A and AB"],"answer":0,"explain":"B positive already recognizes B and Rh as self, and recognizes the lack of antigens on O. It does not recognize A, so A and AB are unsafe."},{"id":"b39","deck":"blood","prompt":"Which blood types can an A-negative patient receive?","choices":["A negative and O negative","A positive, A negative, O positive, and O negative","B negative and O negative","AB negative only"],"answer":0,"explain":"A negative recognizes A, and recognizes O. It does not recognize B, and it must not receive the Rh antigen."},{"id":"b40","deck":"blood","prompt":"To which patients can AB-positive blood be donated?","choices":["AB positive only","Every ABO and Rh type","AB positive and AB negative","O negative and AB positive"],"answer":0,"explain":"AB positive cells carry A, B, and Rh. Only a recipient who already has all three can take them. O negative is the donor that can go to everyone, not AB positive."},{"id":"b41","deck":"blood","prompt":"To which patients can O-negative blood be donated?","choices":["All eight ABO and Rh types","O negative only","Only Rh-negative patients","Only type O patients"],"answer":0,"explain":"O negative has no A, no B, and no Rh antigen, so it brings nothing a recipient would see as foreign. That is why it is the universal donor."},{"id":"b42","deck":"blood","prompt":"A sample clumps in anti-A serum and does not clump in anti-B serum. The ABO type is","choices":["Type A","Type B","Type AB","Type O"],"answer":0,"explain":"Agglutination means the antibodies found their antigen. Anti-A bound A. Anti-B found nothing. Type O clumps with neither serum; type AB clumps with both."},{"id":"b43","deck":"blood","prompt":"You are born with antibodies against","choices":["The ABO antigens you do not have on your own red cells","Every antigen you carry, including your own","Only Rh, never A or B","Platelets, but never red-cell antigens"],"answer":0,"explain":"A safe transfusion gives the recipient only antigens it already treats as self. Anything extra is attacked, and the cells clump and rupture."},{"id":"h01","deck":"heart","prompt":"The cardiovascular system in this lecture is","choices":["A closed system: the heart pumps, and vessels carry blood to the whole body","An open system that dumps blood into body cavities","A lymphatic circuit that does not return to the heart","A set of ducts like exocrine glands"],"answer":0,"explain":"The function is transport: oxygen, nutrients, wastes, and hormones to and from cells. The heart keeps that blood moving."},{"id":"h02","deck":"heart","prompt":"Which heart fact matches the lecture?","choices":["About 100,000 beats a day, about 1.5 million gallons a year, and about 5 to 30 liters per minute","About 10 beats a day and 1 liter per year","The heart rests for most of each day and does not pump continuously","Output never changes with activity"],"answer":0,"explain":"Those are the introductory numbers. Cardiac output later in the unit explains how rate and stroke volume set the liters per minute."},{"id":"h03","deck":"heart","prompt":"How is the heart oriented in the chest?","choices":["The apex points down and to the left; the base is superior; the heart sits left of midline, slightly rotated, on an oblique angle","The apex is the superior base, pointing right","The heart sits on the midline with the apex pointing at the right shoulder","The base rests on the diaphragm and the apex touches the neck"],"answer":0,"explain":"Apex is the pointed inferior end. Base is the broader superior end. That leftward oblique lie is why the left ventricle forms so much of the apex."},{"id":"h04","deck":"heart","prompt":"The pericardium","choices":["Is the membrane around the heart that cuts friction from constant beating","Is the cardiac muscle itself","Is the simple squamous lining of the chambers","Is a valve between the atria"],"answer":0,"explain":"Two layers: visceral pericardium against the heart, parietal pericardium toward the lungs and chest wall. The cavity between them is the friction-reducing space."},{"id":"h05","deck":"heart","prompt":"Visceral and parietal pericardium are","choices":["Visceral is the inner layer on the heart; parietal is the outer layer toward the lungs and thoracic wall","Visceral is outside; parietal is on the muscle","Both names mean the myocardium","Parietal pericardium is the endocardium"],"answer":0,"explain":"The balloon-and-fist picture in the lecture is the same idea: the fist is the heart, the clinging layer is visceral, the outer layer is parietal."},{"id":"h06","deck":"heart","prompt":"The three layers of the heart wall, from outside in, are","choices":["Epicardium, myocardium, endocardium","Endocardium, parietal pericardium, blood","Myocardium, valve, auricle","Parietal pericardium, air space, diaphragm"],"answer":0,"explain":"Epicardium is the visceral pericardium. Myocardium is cardiac muscle and the thickest layer. Endocardium lines the chambers and is endothelium, a simple squamous epithelium."},{"id":"h07","deck":"heart","prompt":"Atria and ventricles","choices":["Atria receive blood and push it into the ventricles; ventricles discharge blood out of the heart","Ventricles only receive blood; atria pump it to the lungs and body","Both sides only store blood and never contract","The left atrium is the most muscular chamber"],"answer":0,"explain":"There are two atria and two ventricles. The left ventricle is the most muscular chamber because it pumps the systemic circuit."},{"id":"h08","deck":"heart","prompt":"Which external landmark is paired correctly?","choices":["Auricles sit on the atria; interventricular sulci separate the ventricles lengthwise; the coronary sulcus separates atria from ventricles crosswise","Auricles are the semilunar valves","The coronary sulcus runs between the two ventricles only","Interventricular sulci separate the atria from each other horizontally"],"answer":0,"explain":"There is an anterior and a posterior interventricular sulcus. Fat often marks the sulci, and coronary vessels travel in them."},{"id":"h09","deck":"heart","prompt":"“Holes in the heart” in this lecture means","choices":["Abnormal connections between the right and left atria, or between the right and left ventricles","The normal openings of the venae cavae","The coronary arteries leaving the aorta","The space inside the pericardial cavity"],"answer":0,"explain":"Those connections let blood skip the separation between the two sides. The normal path keeps the right-heart and left-heart streams apart."},{"id":"h10","deck":"heart","prompt":"The four valves and their one-way rules are","choices":["Two AV valves let blood flow only from atria to ventricles; two semilunar valves let blood flow only from ventricles out into circulation","AV valves guard the aorta and pulmonary trunk","Semilunar valves sit between atria and ventricles","All four valves open at the same time during filling"],"answer":0,"explain":"The AV valves are the tricuspid (right) and mitral (left). The semilunar valves are pulmonary and aortic."},{"id":"h11","deck":"heart","prompt":"The heart is a double pump. Which pairing is correct?","choices":["The right side sends deoxygenated blood to the lungs; the left side sends oxygenated blood to the body","The right side feeds the body; the left side feeds only the lungs","Both sides send oxygenated blood through the venae cavae","Oxygenation is what decides whether a vessel is an artery"],"answer":0,"explain":"Right heart, pulmonary circuit, lungs. Left heart, systemic circuit, body. Arteries leave the heart and veins return to it, whether the blood is oxygenated or not."},{"id":"h12","deck":"heart","prompt":"Which vessels belong to the pulmonary circuit on the right side of the heart?","choices":["Superior vena cava, inferior vena cava, pulmonary trunk, and pulmonary arteries","Pulmonary veins and the aorta","Only the aorta and coronary arteries","Only the left AV valve"],"answer":0,"explain":"Systemic-circuit vessels on the left are the pulmonary veins (returning from the lungs) and the aorta (leaving for the body)."},{"id":"h13","deck":"heart","prompt":"Starting at the venae cavae, which order is the pulmonary circuit?","choices":["Venae cavae, right atrium, right AV valve, right ventricle, pulmonary valve, pulmonary trunk, pulmonary arteries, lungs","Venae cavae, left atrium, aortic valve, lungs","Pulmonary veins, right ventricle, aorta, lungs","Right ventricle, right atrium, venae cavae, lungs"],"answer":0,"explain":"The right atrium receives deoxygenated blood. The right ventricle pumps it toward the lungs. The pulmonary circuit ends once the lungs oxygenate the blood."},{"id":"h14","deck":"heart","prompt":"After the lungs, systemic flow runs","choices":["Pulmonary veins, left atrium, left AV valve, left ventricle, aortic valve, aorta, body","Pulmonary arteries, right atrium, aorta","Superior vena cava, left ventricle, pulmonary trunk","Aorta, right AV valve, lungs, coronary sinus"],"answer":0,"explain":"Pulmonary veins are the exception people miss: they carry oxygenated blood, but they are still veins because they bring blood to the heart."},{"id":"h15","deck":"heart","prompt":"The same four-step pattern happens on both sides of the heart. It is","choices":["Veins fill an atrium, the atrium pumps across an AV valve into a ventricle, the ventricle pumps through a semilunar valve into a large artery, and that artery carries blood away","Arteries fill the ventricles first, then the atria","Both ventricles pump into the venae cavae","Semilunar valves fill the atria"],"answer":0,"explain":"Right and left are anatomically parallel. What differs is where the large artery goes: lungs on the right, body on the left."},{"id":"h16","deck":"heart","prompt":"During one heartbeat, the two sides","choices":["Contract together: both atria pump into both ventricles, then both ventricles pump, one to the lungs and one to the body","Alternate, so the right side finishes the whole circuit before the left side starts","Never eject blood in the same heartbeat","Use the pulmonary trunk and the aorta to carry the same oxygenated blood"],"answer":0,"explain":"One beat moves blood in both circuits. As the pulmonary trunk carries deoxygenated blood to the lungs, the aorta carries oxygenated blood to the body."},{"id":"h17","deck":"heart","prompt":"Coronary arteries","choices":["Leave the aorta near its base and deliver highly oxygenated, high-pressure blood to the heart muscle itself","Drain deoxygenated blood from the body into the right atrium","Are veins that return blood from the lungs","Open only during atrial diastole and never from the aorta"],"answer":0,"explain":"The heart does not feed itself from the blood sitting in the chambers. It has its own arterial supply off the aorta. A heart attack is a blocked coronary artery."},{"id":"h18","deck":"heart","prompt":"Systole and diastole","choices":["Systole is contraction and high pressure; diastole is relaxation and low pressure","Systole is relaxation; diastole is contraction","Both words mean the same phase of filling","Diastole is when the semilunar valves first open to eject blood"],"answer":0,"explain":"In ventricular systole the ventricles eject into the pulmonary trunk and aorta while the atria are refilling. In ventricular diastole the ventricles refill and pressure is low."},{"id":"h19","deck":"heart","prompt":"Put the right-heart steps in order after blood is already in the right atrium.","choices":["Right AV valve, right ventricle, pulmonary semilunar valve, pulmonary trunk","Aortic valve, left ventricle, pulmonary veins","Pulmonary veins, mitral valve, aorta","Left AV valve, lungs, superior vena cava"],"answer":0,"explain":"Blood leaves the right atrium only through the right AV valve. It leaves the right ventricle only through the pulmonary valve, into the trunk, then the right and left pulmonary arteries."},{"id":"h20","deck":"heart","prompt":"The pulmonary trunk","choices":["Is the first large artery blood enters on the way to the lungs, and it splits into the pulmonary arteries","Returns oxygenated blood to the left atrium","Is a vein that empties into the right atrium","Is another name for the aorta"],"answer":0,"explain":"Arteries carry blood away from the heart. The pulmonary trunk and arteries head for the lungs even though that blood is still deoxygenated."},{"id":"h21","deck":"heart","prompt":"The left AV valve is also called the mitral valve. Blood crosses it when moving from","choices":["The left atrium into the left ventricle","The left ventricle into the aorta","The right ventricle into the pulmonary trunk","The lungs into the pulmonary arteries"],"answer":0,"explain":"AV valves connect atrium to ventricle. The aortic semilunar valve, not the mitral valve, guards the exit into the aorta."},{"id":"h22","deck":"heart","prompt":"Which chamber pumps oxygenated blood into the aorta?","choices":["Left ventricle","Right ventricle","Right atrium","Left atrium"],"answer":0,"explain":"The left atrium receives oxygenated blood from the pulmonary veins and only delivers it to the left ventricle. The left ventricle generates the systemic pressure."},{"id":"h23","deck":"heart","prompt":"Deoxygenated blood from the body enters the heart through","choices":["The superior and inferior venae cavae, into the right atrium","The pulmonary veins, into the left atrium","The aorta, into the left ventricle","The coronary arteries, into the right ventricle"],"answer":0,"explain":"That is step one of getting oxygen into the blood: collect oxygen-poor blood from the body, then send it to the lungs."},{"id":"h24","deck":"heart","prompt":"Oxygenated blood from the lungs enters the heart through","choices":["The pulmonary veins, into the left atrium","The pulmonary arteries, into the right atrium","The venae cavae, into the left ventricle","The coronary sinus only"],"answer":0,"explain":"Left and right pulmonary veins complete the return from the lungs. From the left atrium the blood still has to cross the left AV valve before the left ventricle can send it to the body."},{"id":"v01","deck":"vessels","prompt":"The heart can beat without a command from the nervous system because","choices":["Cardiac muscle cells depolarize on their own, and the nodal system sets the rhythm","The sympathetic chain must fire before every beat","The pituitary releases a stimulating hormone for each beat","Skeletal muscle around the heart squeezes it"],"answer":0,"explain":"Two systems adjust or set the beat. The autonomic nervous system only adjusts the rhythm. The nodal system controls it and does not depend on the nervous system."},{"id":"v02","deck":"vessels","prompt":"Sympathetic and parasympathetic fibers change the heart in opposite ways.","choices":["Sympathetic fibers raise heart rate and contraction strength; parasympathetic fibers lower both","Sympathetic fibers lower rate; parasympathetic fibers raise force","Both branches only change blood type","Parasympathetic fibers replace the SA node"],"answer":0,"explain":"The ANS does not create the beat. It turns the existing nodal rhythm up or down."},{"id":"v03","deck":"vessels","prompt":"Which order matches the nodal system?","choices":["SA node, AV node, bundle of His and bundle branches, Purkinje fibers","Purkinje fibers, bundle branches, SA node, AV node","AV node, pulmonary valve, SA node, aorta","Bundle of His, vena cava, AV node, mitral valve"],"answer":0,"explain":"The SA node is in the right atrium and is the pacemaker. The AV node sits at the junction of atria and ventricles. The bundle of His and bundle branches run in the interventricular septum. Purkinje fibers spread through the ventricular muscle."},{"id":"v04","deck":"vessels","prompt":"The conduction sequence of one beat is","choices":["SA node fires, the impulse spreads through the atria, the atria contract, the AV node delays, then the signal runs through the bundle system and the ventricles contract","Ventricles contract first so the atria can fill","The AV node starts the beat and the SA node only delays it","Purkinje fibers fire before the atria contract"],"answer":0,"explain":"The brief AV delay gives the ventricles time to finish filling before they contract and eject."},{"id":"v05","deck":"vessels","prompt":"Which of the following are conducting fibers?","choices":["Bundle of His, bundle branches, and Purkinje fibers","Only the SA node","Only the AV valves","The coronary arteries"],"answer":0,"explain":"The lecture’s choices were bundle of His, bundle branches, Purkinje fibers, or all of them. All of those are conducting fibers. The nodes start and delay the signal; the fibers carry it."},{"id":"v06","deck":"vessels","prompt":"What do Purkinje fibers do?","choices":["Distribute the electrical signal through the ventricular myocardium","Act as the first fibers to receive the signal from the AV node","Carry the signal down the interventricular septum alone","Set the heart rate from the right atrium"],"answer":0,"explain":"The bundle of His is first after the AV node. The bundle branches carry the signal down the septum. Purkinje fibers spread it through the ventricular muscle so the ventricles contract."},{"id":"v07","deck":"vessels","prompt":"Which rhythm label matches the lecture?","choices":["Sinus rhythm, tachycardia, and bradycardia can be normal patterns; arrhythmia is abnormal","Arrhythmia is the only normal rhythm","Sinus rhythm means the AV node has failed","Bradycardia means the ventricles are fibrillating"],"answer":0,"explain":"An artificial pacemaker replaces the SA node when that pacemaker can no longer set a usable rhythm."},{"id":"v08","deck":"vessels","prompt":"The five phases of the cardiac cycle, in lecture order, are","choices":["Atrial diastole, atrial systole, isovolumetric contraction, ventricular systole, isovolumetric relaxation","Ventricular systole first, then atrial diastole, then a pause with every valve open","Only systole and diastole, with no isovolumetric phases","Isovolumetric relaxation, then ejection, then atrial systole, then a clot"],"answer":0,"explain":"One cardiac cycle is one heartbeat: contraction plus relaxation. Pressure and valve position change at each phase."},{"id":"v09","deck":"vessels","prompt":"During atrial diastole","choices":["The heart is relaxed, pressure is low, AV valves are open, semilunar valves are closed, and blood flows passively into the atria and on into the ventricles","All valves are closed and the ventricles eject","The semilunar valves are open and the atria are contracting","The ventricles are empty and the AV valves are shut"],"answer":0,"explain":"This is the first phase, ventricular filling while everything is relaxed. Most ventricular filling is passive, before the atria contract."},{"id":"v10","deck":"vessels","prompt":"Atrial systole","choices":["Is the atria contracting and topping off the ventricles, which are still relaxed and end maximally filled","Is ventricular ejection through open semilunar valves","Is the phase when every valve is closed","Is the “dub” of semilunar valves slamming shut"],"answer":0,"explain":"The ventricles stay in diastole during this phase. Atrial contraction finishes filling them."},{"id":"v11","deck":"vessels","prompt":"Isovolumetric contraction means","choices":["Ventricular pressure is rising, every valve is closed, and the ventricles are sealed chambers","Blood is leaving through open semilunar valves","The atria are filling the ventricles through open AV valves","The semilunar valves have just closed at the end of ejection"],"answer":0,"explain":"Volume cannot change while both sets of valves are shut. Pressure climbs until it beats the pressure in the pulmonary trunk and aorta."},{"id":"v12","deck":"vessels","prompt":"Ventricular systole, the ejection phase,","choices":["Opens the semilunar valves, ejects blood, and is the systolic blood pressure. The atria are relaxed and filling","Closes every valve and holds volume constant","Is passive filling through open AV valves","Is the low-pressure number in a blood-pressure reading"],"answer":0,"explain":"Ejection starts only when ventricular pressure passes arterial pressure. Systolic pressure is this phase. Diastolic pressure is tied to the relaxation that follows."},{"id":"v13","deck":"vessels","prompt":"Isovolumetric relaxation","choices":["Begins as the ventricles relax, the semilunar valves close, and the AV valves open once atrial pressure exceeds ventricular pressure. This is the diastolic pressure","Is the ejection of blood into the aorta","Is atrial contraction with open semilunar valves","Happens only on the right side of the heart"],"answer":0,"explain":"Semilunar valves shut when ventricular pressure falls below arterial pressure. AV valves then open and filling can start again."},{"id":"v14","deck":"vessels","prompt":"The heart sounds in this lecture are","choices":["“Lub” from the AV valves closing, and “dub” from the semilunar valves closing, with the pause as the heart fills","Lub from the semilunar valves opening, and dub from the SA node","Both sounds from the atria contracting","Lub from a coronary artery closing"],"answer":0,"explain":"The slides attach lub to AV-valve closure and dub to semilunar-valve closure. In standard timing, the AV valves close as ventricular systole begins, and the semilunar valves close as ejection ends."},{"id":"v15","deck":"vessels","prompt":"Cardiac output is","choices":["The amount of blood each ventricle pumps in one minute, equal to stroke volume times heart rate","The volume of one beat only, in beats per minute","Blood pressure times vessel length","The hematocrit times the heart rate"],"answer":0,"explain":"CO = HR × SV. The lecture’s average is 75 beats/min × 70 ml/beat = 5250 ml/min, or 5.25 L/min, close to the whole blood volume each minute."},{"id":"v16","deck":"vessels","prompt":"Stroke volume is","choices":["The volume one ventricle ejects in one beat. The lecture average is 70 ml, and it depends on how much the muscle is stretched","The number of beats in a minute","Always 5.25 liters, regardless of stretch","The same number as heart rate"],"answer":0,"explain":"More stretch, stronger contraction. Venous return, the deoxygenated blood coming back from the body, is the main factor that sets that stretch."},{"id":"v17","deck":"vessels","prompt":"If stroke volume falls, heart rate often rises so cardiac output can stay the same. Which pair shows that?","choices":["75 beats/min × 70 ml equals 105 beats/min × 50 ml, both 5.25 L/min","A lower stroke volume always lowers output, and heart rate cannot change","Heart rate falls whenever stroke volume falls","Output is stroke volume divided by heart rate"],"answer":0,"explain":"The product is what the body is defending. Rate and force can trade off. They cannot always trade off enough, which is the point of heart failure."},{"id":"v18","deck":"vessels","prompt":"A ventricle ejects 100 ml per beat at 60 beats per minute. Cardiac output is","choices":["6,000 ml/min","160 ml/min","6,000 beats/min","1.6 L/min"],"answer":0,"explain":"CO = 100 ml/beat × 60 beats/min. Units of cardiac output are volume per minute. Stroke volume is the 100 ml/beat; heart rate is the 60."},{"id":"v19","deck":"vessels","prompt":"End-diastolic volume is 120 ml and end-systolic volume is 50 ml. Stroke volume is","choices":["70 ml/beat","170 ml/beat","50 ml/beat","120 beats/min"],"answer":0,"explain":"What was in the ventricle at the end of filling, minus what is left after ejection, is the stroke volume: 120 − 50 = 70 ml/beat."},{"id":"v20","deck":"vessels","prompt":"Stroke volume is 70 ml/beat and heart rate is 80 beats/min. How much blood is pumped in one minute?","choices":["5,600 ml/min","150 ml/min","5,600 beats/min","70 L/min"],"answer":0,"explain":"70 × 80 = 5,600 ml/min. That is the cardiac output, not the stroke volume and not the heart rate."},{"id":"v21","deck":"vessels","prompt":"Congestive heart failure in this lecture is","choices":["A weak heart with a falling stroke volume, and a heart rate that cannot make up the difference, so cardiac output falls","A faster heart with a larger stroke volume","Only a valve that is stuck open, with normal muscle","A high platelet count"],"answer":0,"explain":"Causes include atherosclerosis, high blood pressure, and muscle damage after a heart attack. Drugs used for CHF aim to raise stroke volume."},{"id":"v22","deck":"vessels","prompt":"Left-sided and right-sided failure back up in different places.","choices":["Left-sided failure backs up into the lungs and causes coughing; right-sided failure backs up into the body and swells feet, ankles, and fingers","Left-sided failure swells the ankles; right-sided failure fills only the lungs","Neither side affects the other, ever","Both sides back up into the lymphatic vessels only"],"answer":0,"explain":"Blood backs up where it came from. The left heart receives from the lungs. The right heart receives from the body. One-sided failure eventually fails the whole heart."},{"id":"v23","deck":"vessels","prompt":"What heart rate would you expect when stroke volume is down, as in congestive heart failure?","choices":["An increased heart rate","A decreased heart rate","No change in heart rate","A rate of zero until the SA node is replaced"],"answer":0,"explain":"Rate rises to defend cardiac output when each beat ejects less. In CHF that rise is not enough, so output still falls, but the expected direction of the rate is up."},{"id":"v24","deck":"vessels","prompt":"In a patient with heart failure, what do we want the blood vessels to do?","choices":["Dilate","Constrict","Stay completely unchanged","Close their valves permanently"],"answer":0,"explain":"Wider vessels lower the resistance the weak ventricle has to push against. Constriction would raise the work of a heart that is already failing."},{"id":"v25","deck":"vessels","prompt":"In heart failure, what do we want the kidneys to do?","choices":["Get rid of extra fluid","Keep as much fluid as possible","Ignore fluid balance","Release more renin so volume keeps rising"],"answer":0,"explain":"Extra volume backs up into lungs or tissues. Losing fluid, as with a diuretic, lowers that backup. This is the same idea as treating pulmonary edema with a drug like Lasix."},{"id":"v26","deck":"vessels","prompt":"Which vessels are described correctly?","choices":["Arteries and arterioles carry blood away from the heart toward capillaries; venules and veins return it; capillaries are where blood and tissues exchange","Veins always carry oxygenated blood; arteries always carry deoxygenated blood","Capillaries are only on the arterial side and never connect to veins","Arterioles return blood to the atria"],"answer":0,"explain":"Direction relative to the heart, not oxygen, names the vessel. Pulmonary arteries still carry deoxygenated blood."},{"id":"v27","deck":"vessels","prompt":"The three layers of a blood-vessel wall are","choices":["Tunica intima (endothelium), tunica media (smooth muscle under autonomic control), and tunica externa (connective tissue)","Epicardium, myocardium, endocardium","Cortex, medulla, capsule","Only endothelium, with no muscle in any artery"],"answer":0,"explain":"The intima is the friction-reducing lining. The media changes diameter. The externa supports and protects. The lumen is the open space inside."},{"id":"v28","deck":"vessels","prompt":"Atherosclerosis and an aneurysm are","choices":["Atherosclerosis is an artery narrowed by fat; an aneurysm is an artery with a weakened wall that can rupture","Both names for varicose veins","Atherosclerosis is a vein with broken valves; an aneurysm is a low platelet count","Both are harmless and never obstruct flow"],"answer":0,"explain":"Fatty narrowing raises pressure, blocks flow, and can rupture into a clot. An aneurysm’s rupture can be fatal. Varicose veins are a different, nonfatal problem."},{"id":"v29","deck":"vessels","prompt":"Varicose veins are","choices":["Veins whose valves no longer work, related to age, genetics, or stress on the veins, and they are not fatal","Arteries narrowed by fat","The same emergency as a ruptured aneurysm","Clots that have traveled to the brain"],"answer":0,"explain":"Veins are low-pressure and need valves, plus the skeletal-muscle pump and the respiratory pump, to move blood toward the heart. Failed valves let blood pool."},{"id":"v30","deck":"vessels","prompt":"Arteries in this lecture","choices":["Carry blood away from the heart toward capillaries, run at high pressure, and include elastic arteries, muscular arteries, and arterioles","Always carry oxygen-rich blood, including the pulmonary arteries","Have valves as their main feature and run at low pressure","Drain capillary beds"],"answer":0,"explain":"In the pulmonary circuit they run toward the lungs. In the systemic circuit they run toward the cells. Arterioles hand blood to capillaries."},{"id":"v31","deck":"vessels","prompt":"Veins","choices":["Return blood to the heart, drain capillaries, run at low pressure, and include venules plus veins, often paired with arteries","Are the high-pressure vessels that leave the left ventricle","Have no relationship to arteries","Exchange oxygen directly, the way capillaries do"],"answer":0,"explain":"The lecture’s wording “towards from the heart” means toward the heart. Venules drain capillaries. Larger veins often travel with a matching artery."},{"id":"v32","deck":"vessels","prompt":"At a capillary, oxygen and carbon dioxide move","choices":["Oxygen leaves the blood for the cells; carbon dioxide leaves the cells for the blood, each down its concentration gradient","Both gases move from low concentration to high concentration","Oxygen enters the blood from resting cells because cells have more oxygen than blood","Neither gas crosses a capillary wall"],"answer":0,"explain":"Blood is high in oxygen and low in waste. Cells are the reverse. Everything in this lecture’s exchange moves from high to low."},{"id":"v33","deck":"vessels","prompt":"Fluid movement across a capillary depends on two pressures.","choices":["Blood pressure pushes plasma out; osmotic pressure pulls plasma in","Osmotic pressure pushes plasma out; blood pressure has no role","Both pressures only move fluid into the lymph nodes","Neither pressure acts on the venous end"],"answer":0,"explain":"On the arterial side, blood pressure wins and fluid leaves. On the venous side, osmotic pressure wins and most of that fluid returns."},{"id":"v34","deck":"vessels","prompt":"Which region of a capillary bed has the high blood pressure that drives fluid out?","choices":["The arterial end","The venous end","Only the lymphatic capillary","The valve in a varicose vein"],"answer":0,"explain":"Arterial end: blood pressure is greater than osmotic pressure, so plasma is pushed out. Venous end: osmotic pressure dominates and fluid is pulled back in."},{"id":"v35","deck":"vessels","prompt":"Which statement matches the arterial side of a capillary?","choices":["Plasma is pushed out by high blood pressure","Plasma is pulled back in by high blood pressure","Plasma is pushed out by high osmotic pressure","Plasma is pulled back in by high osmotic pressure"],"answer":0,"explain":"High blood pressure at the start of the capillary forces fluid into the interstitial space. The pull back in is the venous-side story."},{"id":"v36","deck":"vessels","prompt":"Which statement matches the venous side of a capillary?","choices":["Plasma is pulled back in by high osmotic pressure","Plasma is pushed out by high blood pressure","Plasma is pulled back in by high blood pressure","Plasma is pushed out by high osmotic pressure"],"answer":0,"explain":"By the venule end, blood pressure has fallen below osmotic pressure. Most of the plasma that left comes back. What does not come back can become lymph."},{"id":"v37","deck":"vessels","prompt":"Which arteries leave the aortic arch, in the usual pattern from the lecture diagram?","choices":["Brachiocephalic trunk, left common carotid artery, and left subclavian artery","Right and left pulmonary veins","Superior and inferior venae cavae","Hepatic portal vein and splenic vein"],"answer":0,"explain":"The brachiocephalic trunk then supplies the right common carotid and right subclavian. Coronary arteries leave the ascending aorta. The descending aorta continues behind the heart into the abdomen."},{"id":"v38","deck":"vessels","prompt":"The cerebral arterial circle is also called","choices":["The circle of Willis","The hepatic portal system","The coronary sulcus","The sella turcica"],"answer":0,"explain":"It links the internal carotid and vertebral-basilar routes on the underside of the brain, including the anterior, middle, and posterior cerebral arteries and the communicating arteries."},{"id":"v39","deck":"vessels","prompt":"The hepatic portal vein","choices":["Carries blood from digestive organs to the liver before that blood returns to the general circulation","Carries oxygenated blood from the lungs to the left atrium","Is an artery off the aortic arch","Drains the brain into the superior vena cava directly, with no liver stop"],"answer":0,"explain":"Portal blood mixes in liver sinusoids with arterial blood from the hepatic artery. Hepatic veins then leave the liver for the inferior vena cava. The lecture compares the portal vein arrangement to a chair."},{"id":"v40","deck":"vessels","prompt":"The skeletal-muscle pump and the respiratory pump","choices":["Help return low-pressure venous blood toward the heart","Replace the SA node","Are how arteries create systolic pressure","Filter lymph in the inguinal nodes"],"answer":0,"explain":"Contracting muscle squeezes veins, and valves stop backflow. Breathing changes pressure in the chest and abdomen and moves venous blood toward the heart."},{"id":"l01","deck":"lymph","prompt":"The lymphatic system in this lecture has two kinds of structure and three jobs. The jobs are","choices":["Return leaked fluid to the blood, carry dietary lipids, and take part in immunity","Pump blood, make red cells, and secrete insulin","Only filter urine","Replace the nodal system of the heart"],"answer":0,"explain":"The structures are lymphatic vessels and lymphoid organs. The cells emphasized are macrophages, dendritic cells, and lymphocytes."},{"id":"l02","deck":"lymph","prompt":"Lymph is","choices":["Plasma that left the capillaries, sat in the interstitial fluid, and is now inside lymphatic vessels","Whole blood inside arteries","Urine in the renal pelvis","The fluid only inside the pericardial cavity"],"answer":0,"explain":"If that fluid is not picked up, it accumulates in the tissues as edema."},{"id":"l03","deck":"lymph","prompt":"At a capillary, before lymph is involved,","choices":["Plasma is pushed out at the arterial end by blood pressure, and most of it is pulled back at the venous end by osmotic pressure","All plasma stays in the vessel","Osmotic pressure empties the capillary at the arterial end","Lymph nodes push plasma out of arteries"],"answer":0,"explain":"The lymphatic vessels exist for the fraction that is not pulled back. That leftover is what becomes lymph."},{"id":"l04","deck":"lymph","prompt":"Edema is more likely when there is","choices":["More fluid delivered to the capillary bed, higher blood pressure, or less fluid removed from the bed","Perfect balance between blood pressure and osmotic pressure","A lower blood pressure and faster venous removal","Fewer capillaries in the tissue"],"answer":0,"explain":"Any of those three tips the bed toward fluid left in the tissue. Failed lymphatic pickup does the same thing."},{"id":"l05","deck":"lymph","prompt":"Edema and effusion differ because","choices":["Edema is fluid in the tissue and is not drainable; effusion is fluid in a cavity and is drainable","Both words mean a clot in an artery","Edema is always inside an empty space such as the abdomen","Effusion is another name for lymph inside a node"],"answer":0,"explain":"Tissue fluid is mixed into the tissue. Cavity fluid sits in a space that can be drained."},{"id":"l06","deck":"lymph","prompt":"Which of the following is an effusion?","choices":["A ruptured splenic mass leaking blood into the abdomen","Fingers swelling while gardening on a hot day","Pulmonary edema from left-sided heart failure","A bruise inside the skin from low platelets"],"answer":0,"explain":"Blood in the abdominal cavity is fluid in a space. Swollen fingers and fluid in lung tissue are edema, not a drainable cavity."},{"id":"l07","deck":"lymph","prompt":"A person with left-sided heart failure develops pulmonary edema. Which treatment fits the lecture?","choices":["A diuretic such as Lasix, so the kidneys excrete more fluid","A chest tube to drain the lung tissue","A rescue inhaler as the only treatment, with no change in fluid","Extra ADH so the kidneys keep more water"],"answer":0,"explain":"Pulmonary edema is fluid in lun
